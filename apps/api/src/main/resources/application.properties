spring.application.name: starter-api

spring.datasource.url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:appdb}
spring.datasource.username: ${DB_USER:appdb}
spring.datasource.password: ${DB_PASSWORD:appdb}
spring.datasource.driver-class-name: org.postgresql.Driver

spring.jpa.hibernate.ddl-auto: validate
spring.jpa.open-in-view: false
spring.jpa.properties.hibernate.format_sql: true
spring.jpa.properties.hibernate.default_schema: public

spring.flyway.enabled: true
spring.flyway.baseline-on-migrate: true
spring.flyway.locations: classpath:db/migration

spring.mail.host: ${MAIL_HOST:localhost}
spring.mail.port: ${MAIL_PORT:1025}
spring.mail.username: ${MAIL_USER:}
spring.mail.password: ${MAIL_PASSWORD:}

server.port: 8080

security.jwt.issuer: starter-api
security.jwt.access-token-ttl: PT15M
security.password-reset-token-ttl: PT1H

app.frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
spring.mail.from: ${MAIL_FROM:noreply@example.com}

logging.level.com.example.app: DEBUG
logging.level.org.springframework.security: DEBUG
logging.level.org.flywaydb: DEBUG